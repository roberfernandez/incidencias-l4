<!DOCTYPE html>
<html lang="ca">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/incidencias-l4/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Consulta i gestió d’incidències dels trens de l’L4">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Incidències L4">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Tren-apple.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/Tren-192.png"/>

  <title>Incidències L4 - TMB</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html:not(.access-approved) flutter-view { visibility: hidden !important; }
    #access-status { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-content: center; padding: 24px; background: #101010; color: white; font: 16px sans-serif; text-align: center; }
    .access-approved #access-status { display: none; }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
  <a class="tmb-home" href="https://roberfernandez.github.io/tmb-agent/" aria-label="Tornar a TMB Agent" title="Tornar a TMB Agent"><img src="https://roberfernandez.github.io/tmb-agent/assets/icons/tmb-agent-192.png" alt=""></a>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    #flutter_host{position:absolute;inset:0;overflow:hidden}
    .tmb-home{position:fixed;z-index:1100;top:max(10px,env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));width:38px;height:38px;display:grid;place-items:center;border-radius:10px}
    .tmb-home img{width:32px;height:32px;border-radius:8px;object-fit:cover}
  </style>
  <div id="flutter_host"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="access-status" role="status">
    <p id="access-message">Comprovant el teu accés…</p>
    <button id="access-retry" hidden>Tornar-ho a provar</button>
    <noscript>Cal activar JavaScript per comprovar l’accés.</noscript>
  </div>
  <script type="module" src="access-entry.js?v=train-photo-preview-v1"></script>
</body>
</html>
