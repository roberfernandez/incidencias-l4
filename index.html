  <meta charset="UTF-8">

  <link rel="manifest" href="manifest.json">
  <style>
    html:not(.access-approved) flutter-view { visibility: hidden !important; }
    #access-status { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-content: center; padding: 24px; background: #101010; color: white; font: 16px sans-serif; text-align: center; }
    .access-approved #access-status { display: none; }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="tmb-return.css">

<body>
  <header class="tmb-return"><a href="https://roberfernandez.github.io/tmb-agent/">← TMB Agent</a></header>
  <div id="flutter_host"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.

    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="access-status" role="status">
    <p id="access-message">Comprovant el teu accés…</p>
    <button id="access-retry" hidden>Tornar-ho a provar</button>
    <noscript>Cal activar JavaScript per comprovar l’accés.</noscript>
  </div>
  <script type="module" src="access-entry.js?v=train-photo-preview-v1"></script>
